# ✅ 解答例: K8s Secretを使ったクレデンシャル管理
# 実運用ではsealed-secretsやExternal Secrets Operatorとの組み合わせを推奨

apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: dojo
type: Opaque
stringData:
  # 実際の値はCIパイプラインやシークレット管理ツールから注入する
  # git管理下に置く場合はsealed-secretsなどで暗号化すること
  password: "REPLACE_WITH_ACTUAL_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: dojo
type: Opaque
stringData:
  # 推奨: IRSAを使えばこのSecretは不要になる
  access-key-id: "REPLACE_WITH_ACTUAL_KEY"
  secret-access-key: "REPLACE_WITH_ACTUAL_SECRET"
