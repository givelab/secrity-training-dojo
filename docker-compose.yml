version: "3.9"

# ⚠️  このファイルは学習用の意図的に脆弱な構成です。本番環境に使用しないこと。

services:
  app:
    build:
      context: ./app
    ports:
      - "8080:3000"
    environment:
      # ⚠️ 課題1: 平文のクレデンシャルが環境変数に直書きされている
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: "super_secret_password_123"
      AWS_ACCESS_KEY_ID: "AKIAIOSFODNN7EXAMPLE"
      AWS_SECRET_ACCESS_KEY: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
      AWS_DEFAULT_REGION: ap-northeast-1
    depends_on:
      db:
        condition: service_healthy
    # ⚠️ 課題2: 特権モードで実行。ホストのDockerソケットをマウント
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      # ⚠️ 課題1: パスワードが平文で設定されている
      POSTGRES_PASSWORD: "super_secret_password_123"
    ports:
      # ⚠️ 課題3: DBポートがホストに露出している
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,iam,ec2,sts,secretsmanager
      AWS_DEFAULT_REGION: ap-northeast-1
      LOCALSTACK_AUTH_TOKEN: ""
    volumes:
      - localstack_data:/var/lib/localstack

volumes:
  localstack_data:
